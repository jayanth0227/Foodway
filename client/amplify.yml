version: 1
 
applications:

  - appRoot: client

    frontend:

      phases:

        preBuild:

          commands:

            - npm ci

        build:

          commands:

            - npm run build

      artifacts:

        baseDirectory: dist

        files:

          - '**/*'

      customHeaders:

        - pattern: '**/*'

          headers:

            - key: 'Strict-Transport-Security'

              value: 'max-age=31536000; includeSubDomains'

      cache:

        paths:

          - node_modules/**/*
 